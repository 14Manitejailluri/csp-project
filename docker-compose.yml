version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: foodrescue-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: foodrescue
    networks:
      - foodrescue-net

  # Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: foodrescue-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/foodrescue
      - JWT_SECRET=foodrescue_production_secret_key_change_me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
      - CLOUDINARY_CLOUD_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_API_SECRET=
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
      - EMAIL_FROM=FoodRescue <noreply@foodrescue.org>
    volumes:
      - server_uploads:/app/uploads
    networks:
      - foodrescue-net

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: foodrescue-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - foodrescue-net

volumes:
  mongo_data:
  server_uploads:

networks:
  foodrescue-net:
    driver: bridge
